name: KPGS Branch Proof

on:
  push:
    branches:
      - "agent/kpgs-*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kpgs-branch-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    name: Install · Lint · Type-check · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deterministic dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test (Vitest)
        run: npm run test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_stub
          CLERK_SECRET_KEY: sk_test_stub
          MONGODB_URI: mongodb://localhost:27017/stub
          CLERK_WEBHOOK_SECRET: whsec_stub
          KasiLinkAI_XAI_API_KEY: xai-stub
