name: KPGS Branch Proof

on:
  push:
    branches:
      - "agent/kpgs-*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kpgs-branch-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    name: Install · Lint · Type-check · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: agent/kpgs-gig-canonical-final

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Reconcile dependency lock after override correction
        shell: bash
        run: |
          npm install --package-lock-only --ignore-scripts
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already reconciled"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(deps): reconcile lockfile after override fix"
            git push origin HEAD:agent/kpgs-gig-canonical-final
          fi

      - name: Install deterministic dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test (Vitest)
        run: npm run test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_stub
          CLERK_SECRET_KEY: sk_test_stub
          MONGODB_URI: mongodb://localhost:27017/stub
          CLERK_WEBHOOK_SECRET: whsec_stub
          KasiLinkAI_XAI_API_KEY: xai-stub
