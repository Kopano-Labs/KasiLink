name: Reconcile KPGS Lock

on:
  push:
    branches:
      - "agent/kpgs-gig-canonical-final"

permissions:
  contents: write

concurrency:
  group: reconcile-kpgs-lock
  cancel-in-progress: true

jobs:
  reconcile:
    if: github.event.head_commit.message != 'chore(deps): reconcile lockfile after override fix'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: agent/kpgs-gig-canonical-final

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Reconcile lockfile only
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit reconciled lock when changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already reconciled"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): reconcile lockfile after override fix"
          git push origin HEAD:agent/kpgs-gig-canonical-final
